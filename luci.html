<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para Luci 🌻</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --sky1: #050608; --sky2: #0a0c12; --sky3: #15110a;
  --ground: #08090c; --ink: #fff3c8; --lead: #ffd23a;
  --letter-font: var(--serif); --fs: clamp(1rem, 4.3vw, 1.12rem);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --hand: "Caveat", "Segoe Script", "Comic Sans MS", cursive;
  --sans: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans);
  background: linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 55%, var(--sky3) 100%);
}
.stage { position: relative; width: 100%; height: 100%; overflow: hidden; }

.star { position: absolute; border-radius: 50%; background: #fff; opacity: .7; animation: twinkle var(--t, 4s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
@keyframes twinkle { from { opacity: .15; } to { opacity: .95; } }
.shoot { position: absolute; height: 2px; width: 110px; background: linear-gradient(90deg, rgba(255,255,255,0), #fff); opacity: 0; transform: rotate(35deg); animation: shoot 8s linear infinite; animation-delay: var(--dl, 0s); }
@keyframes shoot {
  0% { opacity: 0; transform: translate(0, 0) rotate(35deg); }
  3% { opacity: 1; }
  12% { opacity: 0; transform: translate(190px, 133px) rotate(35deg); }
  100% { opacity: 0; }
}

#garden {
  position: absolute; left: 0; right: 0; bottom: 0; height: 76%; width: 100%; z-index: 1; overflow: visible;
  transition: bottom 1.6s cubic-bezier(.2,.8,.2,1), height 1.6s cubic-bezier(.2,.8,.2,1);
}
.lift #garden { bottom: 50%; height: 50%; }

.wood { fill: none; stroke: #7a4a28; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
.grown .wood { animation: draw 1.6s cubic-bezier(.3,.7,.3,1) forwards; animation-delay: var(--d, 0s); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fl { transform: scale(0); }
.grown .fl { animation: pop .9s cubic-bezier(.2,1.5,.4,1) forwards; animation-delay: var(--d); }
@keyframes pop { to { transform: scale(1); } }

#start {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4;
  display: flex; align-items: center; gap: .6em; padding: .85em 1.7em; border: 0; border-radius: 999px;
  font-family: var(--sans); font-weight: 800; font-size: 1.2rem; color: #2a1a05; cursor: pointer;
  background: linear-gradient(135deg, #ffe066, #ffb700);
  box-shadow: 0 0 0 0 rgba(255, 194, 26, .6), 0 8px 24px rgba(0,0,0,.3);
  animation: pulse 2.2s ease-out infinite; transition: opacity .6s;
}
#start:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
.grown #start { opacity: 0; pointer-events: none; animation: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 18px rgba(255, 194, 26, 0), 0 8px 24px rgba(0,0,0,.3); } 100% { box-shadow: 0 0 0 0 rgba(255, 194, 26, 0), 0 8px 24px rgba(0,0,0,.3); } }

#mute {
  position: absolute; right: 14px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 5;
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.4); color: #fff;
  font-size: 1.15rem; display: none; cursor: pointer;
}
.grown #mute { display: block; }

.rain { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.drop { position: absolute; top: 4%; opacity: 0; animation: fall var(--dur, 10s) linear infinite; animation-delay: var(--dl, 0s); }
@keyframes fall {
  0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
  10% { opacity: .9; }
  50% { transform: translate(var(--sx, 20px), 34vh) rotate(90deg); }
  100% { transform: translate(calc(var(--sx, 20px) * -1), 74vh) rotate(200deg); opacity: 0; }
}
.fireflies { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.fly { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #ffe98a; box-shadow: 0 0 10px 3px rgba(255,226,120,.7); opacity: 0; }
.fireflies.on .fly { animation: drift var(--dur, 9s) ease-in-out infinite alternate, blink var(--b, 3s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes drift { from { transform: translate(0, 0); } to { transform: translate(var(--dx, 30px), var(--dy, -40px)); } }
@keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: .95; } }

.letter {
  position: absolute; left: 0; right: 0; bottom: 0; height: 50%; z-index: 3;
  background: var(--ground); color: var(--ink); text-align: center; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 22px 8% calc(env(safe-area-inset-bottom, 0px) + 28px); transform: translateY(101%);
  transition: transform 1.6s cubic-bezier(.2,.8,.2,1);
  font-family: var(--letter-font); font-size: var(--fs); line-height: 1.5;
}
.letter.show { transform: none; }
.tw { position: relative; max-width: 36ch; margin: 0 auto; }
.tw span { display: block; white-space: pre-wrap; }
.ghost { visibility: hidden; }
.typed { position: absolute; left: 0; top: 0; width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .star, .shoot, #start { animation: none; }
  .grown .wood, .grown .fl { animation-duration: .01s; animation-delay: 0s; }
  #garden, .letter { transition: none; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg id="garden" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet" aria-label="Ramo de lirios amarillos con papel negro y moño dorado">
    <defs id="defs">
      <radialGradient id="glow"><stop offset="0" stop-color="#ffd86b" stop-opacity=".5"/><stop offset="1" stop-color="#ffd86b" stop-opacity="0"/></radialGradient>
      <radialGradient id="sfc" cx="40%" cy="40%" r="70%"><stop offset="0" stop-color="#6b4116"/><stop offset="1" stop-color="#2a1607"/></radialGradient>
      <radialGradient id="sbc" cx="45%" cy="40%" r="70%"><stop offset="0" stop-color="#5a3510"/><stop offset="1" stop-color="#1c0f05"/></radialGradient>
      <linearGradient id="lilyG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff9d1c"/><stop offset=".55" stop-color="#ffd23a"/><stop offset="1" stop-color="#fff59a"/></linearGradient>
      <linearGradient id="pinkA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4a6d8"/><stop offset="1" stop-color="#9a5cc8"/></linearGradient>
      <linearGradient id="pinkB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc4e8"/><stop offset="1" stop-color="#d27fc4"/></linearGradient>
      <linearGradient id="pinkC" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c58cf0"/><stop offset="1" stop-color="#8a55c0"/></linearGradient>
    </defs>
    <g id="wood"></g>
    <g id="flowers"></g>
    <path d="M-1200 522 L0 522 C90 508 150 518 200 514 C270 508 330 518 400 506 L1600 506 L1600 1000 L-1200 1000Z" fill="var(--ground)"/>
  </svg>

  <div class="rain" id="rain" aria-hidden="true"></div>
  <div class="fireflies" id="fireflies" aria-hidden="true"></div>

  <button id="start" type="button">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2a1a05" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
    <span>Ábreme</span>
  </button>
  <button id="mute" type="button" aria-label="Música">🔊</button>

  <div class="letter" id="letter"><div class="tw"><span class="ghost" id="ghost"></span><span class="typed" id="typed"></span></div></div>
</div>

<script>
(function () {
  var NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  var TEXT = "Para una de mis personas favoritas. 🌻💛\nQuería regalarte estas flores para recordarte\nlo mucho que valoro tenerte en mi vida.\nGracias por cada risa, cada charla,\ncada momento compartido y por ser parte\nde tantos recuerdos que guardo con cariño. 🥹\nEspero que siempre recibas todo el cariño\ny las cosas bonitas que merecés. 💛\nAtte: Naye 💛";
  var stage = document.getElementById("stage");
  var defs = document.getElementById("defs");
  var woodLayer = document.getElementById("wood");
  var flowerLayer = document.getElementById("flowers");
  var HEART = "M0 0 C-12 -10 -6 -18 0 -12 C6 -18 12 -10 0 0Z";
  var YELLOWS = ["#ffd21e", "#ffc400", "#ffe04a", "#f7b500"];

  function woodPath(d, w, delay, color) {
    return el("path", { d: d, "class": "wood", "stroke-width": w, pathLength: 1,
      style: "--d:" + delay + "s" + (color ? ";stroke:" + color : "") }, woodLayer);
  }
  /* grupo que aparece creciendo desde (x, y), con transform propio */
  function popGroup(layer, transform, delay) {
    var g = el("g", { transform: transform }, layer);
    return el("g", { "class": "fl", style: "--d:" + delay.toFixed(2) + "s" }, g);
  }
  /* grupo anclado: crece desde el punto (ax, ay) sin mover su contenido */
  function anchored(layer, ax, ay, delay) {
    var inner = popGroup(layer, "translate(" + ax + " " + ay + ")", delay);
    return el("g", { transform: "translate(" + (-ax) + " " + (-ay) + ")" }, inner);
  }
  function heartLeaf(x, y, s, rot, color, delay) {
    var inner = popGroup(flowerLayer, "translate(" + x.toFixed(1) + " " + y.toFixed(1) + ") rotate(" + rot.toFixed(0) + ") scale(" + s.toFixed(2) + ")", delay);
    el("path", { d: HEART, fill: color, stroke: "rgba(0,40,0,.3)", "stroke-width": 0.6 }, inner);
  }


  /* ramo de lirios amarillos brillantes con papel negro y moño dorado */
  var lily = el("g", { id: "lily" }, defs);
  var LP = "M0 0 C15 -14 18 -46 0 -70 C-18 -46 -15 -14 0 0";
  [[-78, 0.8, 0.85], [78, 0.8, 0.85], [-50, 0.95, 0.92], [50, 0.95, 0.92], [-25, 1.05, 0.96], [25, 1.05, 0.96], [0, 1.15, 1]].forEach(function (p) {
    el("path", { d: LP, transform: "rotate(" + p[0] + ") scale(" + p[1] + ")", fill: "url(#lilyG)", opacity: p[2], stroke: "rgba(255,196,60,.8)", "stroke-width": 0.7 }, lily);
    el("path", { d: LP, transform: "rotate(" + p[0] + ") scale(" + (p[1] * 0.55) + ")", fill: "#fff3a8", opacity: 0.5 }, lily);
  });
  var lheads = [[200, 218, 1.2, 0], [112, 288, 1.05, -14], [290, 278, 1.1, 14], [158, 344, 0.95, -6], [248, 352, 0.98, 8]];
  var wrapB = anchored(flowerLayer, 200, 528, 0.2);
  el("polygon", { points: "90,398 310,398 216,528 184,528", fill: "#17171c" }, wrapB);
  el("polygon", { points: "90,398 310,398 216,528 184,528", fill: "none", stroke: "#d8b45a", "stroke-width": 1.6 }, wrapB);
  lheads.forEach(function (h, i) {
    woodPath("M" + h[0] + " " + h[1] + " Q" + ((h[0] + 200) / 2) + " " + (h[1] + 100) + " 200 470", 7, (0.4 + i * 0.1).toFixed(2), "#4d9a4a");
  });
  lheads.forEach(function (h, i) {
    var inner = popGroup(flowerLayer, "translate(" + h[0] + " " + h[1] + ") rotate(" + h[3] + ") scale(" + h[2] + ")", 1.1 + i * 0.3);
    el("circle", { cx: 0, cy: -38, r: 78, fill: "url(#glow)" }, inner);
    el("use", { href: "#lily" }, inner);
  });
  [[118, 394, -62, "#3f9a4a"], [150, 384, -28, "#2f7f3c"], [250, 382, 28, "#2f7f3c"], [284, 392, 62, "#3f9a4a"], [200, 376, 0, "#3f9a4a"], [176, 388, -10, "#2f7f3c"], [226, 386, 12, "#3f9a4a"]].forEach(function (L, i) {
    heartLeaf(L[0], L[1], 2.5, L[2], L[3], 1.6 + i * 0.12);
  });
  var wrapF = anchored(flowerLayer, 200, 528, 0.25);
  el("polygon", { points: "90,398 200,424 194,528 184,528", fill: "#0d0d11" }, wrapF);
  el("polygon", { points: "310,398 200,424 206,528 216,528", fill: "#25252d" }, wrapF);
  el("polyline", { points: "90,398 200,424 310,398", fill: "none", stroke: "#e0be6a", "stroke-width": 1.6 }, wrapF);
  el("path", { d: "M200 424 L190 528 M200 424 L210 528", fill: "none", stroke: "#b8944a", "stroke-width": 1 }, wrapF);
  var bow = popGroup(flowerLayer, "translate(200 486)", 3.0);
  el("path", { d: "M0 6 C -8 26 -16 36 -28 50", fill: "none", stroke: "#d9ae35", "stroke-width": 7, "stroke-linecap": "round" }, bow);
  el("path", { d: "M0 6 C 8 26 16 36 28 50", fill: "none", stroke: "#d9ae35", "stroke-width": 7, "stroke-linecap": "round" }, bow);
  el("ellipse", { cx: -22, cy: -2, rx: 24, ry: 12, transform: "rotate(-22 -22 -2)", fill: "#e8bf45", stroke: "#a98218", "stroke-width": 1.2 }, bow);
  el("ellipse", { cx: 22, cy: -2, rx: 24, ry: 12, transform: "rotate(22 22 -2)", fill: "#e8bf45", stroke: "#a98218", "stroke-width": 1.2 }, bow);
  el("circle", { cx: 0, cy: 2, r: 8, fill: "#f4d366", stroke: "#a98218", "stroke-width": 1.2 }, bow);
  var cfg = { letterAt: 4800, rain: 16, rainChars: ["\u2665"], rainColors: ["#ff3b57", "#c8102e", "#ffd23a"], shoot: true };


  /* estrellas */
  if (cfg.stars !== false) {
    for (var i = 0; i < 55; i++) {
      var s = document.createElement("div");
      s.className = "star";
      var sz = rnd(1, 2.6);
      s.style.cssText = "left:" + rnd(0, 100) + "%;top:" + rnd(0, 42) + "%;width:" + sz + "px;height:" + sz + "px;--t:" + rnd(2.5, 6) + "s;--dl:" + rnd(0, 4) + "s";
      stage.insertBefore(s, stage.firstChild);
    }
  }
  if (cfg.shoot) {
    for (var q = 0; q < 3; q++) {
      var sh = document.createElement("div");
      sh.className = "shoot";
      sh.style.cssText = "left:" + rnd(5, 55) + "%;top:" + rnd(3, 25) + "%;--dl:" + (q * 2.7 + rnd(0, 1.5)) + "s";
      stage.insertBefore(sh, stage.firstChild);
    }
  }

  var rain = document.getElementById("rain");
  function makeRain() {
    for (var n = 0; n < (cfg.rain || 0); n++) {
      var d = document.createElement("span");
      d.className = "drop";
      d.textContent = pick(cfg.rainChars || ["\u2665"]);
      d.style.cssText = "left:" + rnd(8, 92) + "%;font-size:" + rnd(11, 20) + "px;color:" + pick(cfg.rainColors || ["#ffd23a"]) + ";--dur:" + rnd(8, 14) + "s;--dl:" + rnd(0, 8) + "s;--sx:" + rnd(-30, 30) + "px";
      rain.appendChild(d);
    }
  }
  var ff = document.getElementById("fireflies");
  for (var f = 0; f < (cfg.flies || 0); f++) {
    var fl = document.createElement("span");
    fl.className = "fly";
    fl.style.cssText = "left:" + rnd(4, 94) + "%;top:" + rnd(30, 92) + "%;--dx:" + rnd(-50, 50) + "px;--dy:" + rnd(-60, 20) + "px;--dur:" + rnd(6, 12) + "s;--b:" + rnd(2, 4) + "s;--dl:" + rnd(0, 3) + "s";
    ff.appendChild(fl);
  }

  /* música: caja de música original hecha con Web Audio (no es la canción "Flores Amarillas") */
  var ctx = null, master = null, muted = false, bar = 0, nextT = 0;
  var CH = [[48,60,64,67],[43,59,62,67],[45,60,64,69],[41,60,65,69],[48,60,64,67],[43,59,62,67],[41,60,65,69],[48,60,64,67]];
  var ML = [[[0,76],[2,79],[4,76],[6,74]],[[0,74],[3,71],[4,74],[6,79]],[[0,72],[2,76],[4,81],[6,79]],[[0,77],[2,76],[4,72],[6,69]],
            [[0,76],[2,79],[4,84],[6,79]],[[0,79],[2,74],[4,71],[6,74]],[[0,72],[2,77],[4,76],[6,72]],[[0,76],[4,72],[6,67]]];
  var EIGHTH = 0.4;
  function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function tone(m, t, dur, type, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function playBar(i, t) {
    var c = CH[i], arp = [1, 2, 3, 2, 1, 2, 3, 2];
    tone(c[0], t, 2.6, "sine", 0.22);
    for (var k = 0; k < 8; k++) tone(c[arp[k]], t + k * EIGHTH, 1.1, "triangle", 0.10);
    ML[i].forEach(function (n) { tone(n[1], t + n[0] * EIGHTH, 1.6, "sine", 0.16); });
  }
  function schedule() {
    while (nextT < ctx.currentTime + 0.8) { playBar(bar % 8, nextT); nextT += 8 * EIGHTH; bar++; }
    setTimeout(schedule, 250);
  }
  function startMusic() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      ctx = new AC();
      if (ctx.state === "suspended") ctx.resume();
      master = ctx.createGain(); master.gain.value = 0.5;
      var dl = ctx.createDelay(1); dl.delayTime.value = 0.32;
      var fb = ctx.createGain(); fb.gain.value = 0.32;
      var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
      master.connect(ctx.destination); master.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(ctx.destination);
      nextT = ctx.currentTime + 0.15;
      schedule();
    } catch (e) { ctx = null; }
  }
  var muteBtn = document.getElementById("mute");
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    if (master) master.gain.value = muted ? 0 : 0.5;
    muteBtn.textContent = muted ? "\uD83D\uDD07" : "\uD83D\uDD0A";
  });

  /* carta escrita a mano */
  var letter = document.getElementById("letter");
  var ghost = document.getElementById("ghost");
  var typed = document.getElementById("typed");
  ghost.textContent = TEXT;
  var chars = Array.from(TEXT), ci = 0;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function typeNext() {
    if (ci >= chars.length) return;
    typed.textContent += chars[ci++];
    var over = typed.offsetHeight + 24 - letter.clientHeight;
    if (over > 0) letter.scrollTop = over;
    setTimeout(typeNext, 30);
  }

  var started = false;
  function start() {
    if (started) return;
    started = true;
    stage.classList.add("grown");
    startMusic();
    if (reduce) {
      stage.classList.add("lift"); letter.classList.add("show"); typed.textContent = TEXT; makeRain();
      return;
    }
    setTimeout(function () { ff.classList.add("on"); }, Math.max(0, cfg.letterAt - 1800));
    setTimeout(function () { stage.classList.add("lift"); letter.classList.add("show"); }, cfg.letterAt);
    setTimeout(typeNext, cfg.letterAt + 900);
    setTimeout(makeRain, cfg.letterAt + 400);
  }
  document.getElementById("start").addEventListener("click", start);
})();
</script>
</body>
  </html>
